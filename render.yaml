services:
  - type: web
    name: swajit-engineering-backend
    env: python
    plan: free
    region: oregon
    branch: main
    buildCommand: "cd backend && pip install -r requirements.txt && python manage.py collectstatic --noinput"
    startCommand: "cd backend && gunicorn config.wsgi:application --bind 0.0.0.0:$PORT"
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.3"
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: ALLOWED_HOSTS
        value: ".onrender.com,localhost,127.0.0.1,0.0.0.0"
      - key: CORS_ALLOWED_ORIGINS
        value: "http://localhost:5173,http://localhost:3000,https://your-frontend-domain.example"
      - key: CSRF_TRUSTED_ORIGINS
        value: "http://localhost:5173,http://localhost:3000,https://your-frontend-domain.example"
      - key: EMAIL_HOST
        sync: false
      - key: EMAIL_PORT
        sync: false
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: DEFAULT_FROM_EMAIL
        sync: false
      - key: EMAIL_USE_TLS
        value: "true"
      - key: PASSWORD_RESET_URL
        value: "https://your-frontend-domain.example/reset-password"
